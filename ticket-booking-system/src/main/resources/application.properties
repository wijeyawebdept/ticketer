# -------------------------------------------------------------
# API Rate Limiting Configuration (Token Bucket Algorithm)
# -------------------------------------------------------------
security.ratelimit.enabled=true

# Strict Auth Tier (Login / Register / Gate Login / Password Reset): 10 req/min
security.ratelimit.auth.capacity=10
security.ratelimit.auth.refill-duration-seconds=60

# High-Risk Transaction Tier (Seat Holds / Checkout / Payments): 25 req/min
security.ratelimit.transaction.capacity=25
security.ratelimit.transaction.refill-duration-seconds=60

# General Public API Tier (Catalog / Venues / Events / Pages): 200 req/min
security.ratelimit.general.capacity=200
security.ratelimit.general.refill-duration-seconds=60

