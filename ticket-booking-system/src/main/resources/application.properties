spring.application.name=ticket-booking-system

server.port=8081

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/Ticket_Booking_DB
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true
# Disable open-in-view to prevent database queries during view rendering
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=true
spring.jpa.defer-datasource-initialization=true
# Disabled SQL init mode - no data seeding needed
# spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Hibernate optimization
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection=false
spring.jpa.properties.hibernate.batch_fetch_style=DYNAMIC

# Remove problematic cache configuration
# spring.jpa.properties.hibernate.cache.use_second_level_cache=false
# spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.JCacheRegionFactory

# Query optimization
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Replaced deprecated property
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true

# JWT Configuration
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.ticket.ticket_booking_system=DEBUG
logging.level.org.springframework.security=DEBUG

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Disable H2 console (using PostgreSQL)
spring.h2.console.enabled=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Profile Picture Upload Configuration
app.upload.profile-pictures=uploads/profile-pictures
# Google OAuth Configuration  
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:your_google_client_id_here.apps.googleusercontent.com} 
