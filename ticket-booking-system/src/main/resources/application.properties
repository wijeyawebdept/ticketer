spring.application.name=ticket-booking-system
server.port=8081

# Server Error Handling & Information Leakage Prevention
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Session & Cookie Security (Anti-Hijacking, Anti-Fixation, Anti-XSS)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.max-age=86400
server.servlet.session.tracking-modes=cookie

# Embedded Tomcat High-Concurrency Server Tuning (1000+ Concurrent Users)
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=30
server.tomcat.accept-count=1000
server.tomcat.max-connections=10000
server.tomcat.connection-timeout=20000

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Ticket_Booking_DB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Optimization for High Load & Deadlock Prevention
spring.datasource.hikari.pool-name=TicketBookingHikariPool
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=15000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=false
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true
spring.jpa.open-in-view=false
spring.jpa.generate-ddl=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.platform=postgresql

# Hibernate optimization for high throughput
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection=false
spring.jpa.properties.hibernate.batch_fetch_style=DYNAMIC
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true

# JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=86400000
application.security.jwt.refresh-token.expiration=604800000

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Logging (Optimized for performance under load)
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.com.ticket.ticket_booking_system=INFO
logging.level.org.springframework.security=INFO

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

spring.h2.console.enabled=false

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload.profile-pictures=uploads/profile-pictures

# Google OAuth Configuration
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}

# Auto-release seats for bookings stuck in PENDING (payment never completed) past this many minutes
booking.pending-timeout-minutes=2

# MPGS Payment Gateway Configuration
mpgs.merchant.id=TESTWIJEYHITALKR
mpgs.api.url=https://cbcmpgs.gateway.mastercard.com/api/rest
mpgs.api.version=100
mpgs.api.password=${MPGS_API_PASSWORD}
mpgs.webhook-secret=${MPGS_WEBHOOK_SECRET}
mpgs.currency=LKR

# Payment Callback URLs
# IMPORTANT: MPGS needs ONE return URL - we verify in that page
mpgs.success-url=${APP_BASE_URL:http://localhost:3000}/booking/payment-return
mpgs.cancel-url=${APP_BASE_URL:http://localhost:3000}/booking/payment-cancel
mpgs.error-url=${APP_BASE_URL:http://localhost:3000}/booking/payment-error
app.frontend.base-url=http://localhost:3000


