# Seat Management Configuration
# Add these properties to your application.properties file

# ===============================
# SEAT MANAGEMENT CONFIGURATION
# ===============================

# Seat hold configuration
seat.hold.default-duration-minutes=15
seat.hold.max-duration-minutes=60
seat.hold.cleanup-interval-seconds=60

# WebSocket configuration
spring.websocket.stomp.heartbeat.client=10000,10000
spring.websocket.stomp.heartbeat.server=10000,10000

# Enable scheduled tasks
spring.task.scheduling.enable=true

# Database pool configuration for high-traffic seat operations
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000

# JPA configuration for seat management
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Logging configuration for debugging
logging.level.com.ticket.ticket_booking_system.service.SeatWebSocketService=DEBUG
logging.level.com.ticket.ticket_booking_system.service.impl.SeatServiceImpl=DEBUG
logging.level.org.springframework.messaging=DEBUG