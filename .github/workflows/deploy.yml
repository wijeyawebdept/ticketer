name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files to server (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "ticket-booking-admin,ticket-booking-system"
          target: "/home/ubuntu/Ticket-Booking-System"
          
      - name: Execute deployment commands (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Deploying Frontend..."
            cd /home/ubuntu/Ticket-Booking-System/ticket-booking-admin
            
            # Install dependencies if they have changed
            npm install
            
            # Run the build process (CI=false prevents warnings from failing the build)
            CI=false npm run build 2>&1 | tee /tmp/build.log
            
            # Replace the old build with the new one ONLY if the build directory exists
            if [ -d "build" ]; then
              sudo rm -rf /var/www/ticketer/*
              sudo cp -r build/* /var/www/ticketer/
            else
              echo "Build failed! Skipping frontend deployment."
              exit 1
            fi
            
            # Restart Nginx
            sudo systemctl restart nginx
            echo "Frontend Deployment Complete!"

            echo "Deploying Backend..."
            cd /home/ubuntu/Ticket-Booking-System/ticket-booking-system
            
            # Make sure maven wrapper is executable and build the backend
            chmod +x mvnw
            ./mvnw clean package -DskipTests
            
            # Restart the Java backend service
            echo "Stopping ticketer service..."
            sudo systemctl stop ticketer
            
            echo "Copying new jar file..."
            sudo cp target/*.jar /home/ubuntu/ticketer.jar
            
            echo "Starting ticketer service..."
            sudo systemctl start ticketer
            
            echo "Backend Deployment Complete!"
