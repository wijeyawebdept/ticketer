name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Frontend
        run: |
          cd ticket-booking-admin
          npm install --legacy-peer-deps
          CI=false npm run build

      - name: Setup SSH & Deploy to Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          RAW_HOST: ${{ secrets.SERVER_HOST }}
          RAW_USER: ${{ secrets.SERVER_USERNAME }}
        run: |
          set -e

          # 1. Sanitize HOST and USER (strip whitespace, newlines, quotes, and accidental prefixes)
          SERVER_HOST=$(echo "$RAW_HOST" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/.*@//')
          SERVER_USER=$(echo "$RAW_USER" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/@.*//')
          
          if [ -z "$SERVER_USER" ]; then
            SERVER_USER="ubuntu"
          fi

          echo "Target Host: $SERVER_HOST"
          echo "Target User: $SERVER_USER"

          # 2. Setup SSH Key with clean UNIX line endings
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 3. Add host key to known_hosts
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          
          # 4. Create target directory on server
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" "mkdir -p /home/ubuntu/Ticket-Booking-System"

          # 5. Copy build and backend files to server
          echo "Copying files to server..."
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -r ticket-booking-admin/build ticket-booking-system "$SERVER_USER@$SERVER_HOST:/home/ubuntu/Ticket-Booking-System/"

          # 6. Run deployment and restart services
          echo "Running deployment commands on server..."
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" << 'EOF'
            set -e

            echo "Deploying Frontend..."
            sudo rm -rf /var/www/ticketer/*
            sudo cp -r /home/ubuntu/Ticket-Booking-System/ticket-booking-admin/build/* /var/www/ticketer/
            sudo chown -R www-data:www-data /var/www/ticketer
            sudo chmod -R 755 /var/www/ticketer
            
            # Restart Nginx
            sudo systemctl restart nginx
            echo "Frontend Deployment Complete!"

            echo "Deploying Backend..."
            cd /home/ubuntu/Ticket-Booking-System/ticket-booking-system
            
            # Make sure maven wrapper is executable and build the backend
            chmod +x mvnw
            ./mvnw clean package -DskipTests
            
            # Restart the Java backend service
            echo "Stopping ticketer service..."
            sudo systemctl stop ticketer
            
            echo "Copying new jar file..."
            sudo cp target/*.jar /home/ubuntu/ticketer.jar
            
            echo "Starting ticketer service..."
            sudo systemctl start ticketer
            
            echo "Backend Deployment Complete!"
          EOF
